version: 2

models:
  - name: stg_events
    columns:
      - name: event_type
        tests:
          - accepted_values:
              arguments:
                values: ['view', 'cart', 'purchase']
      - name: event_date
        tests: [not_null]
      - name: product_id
        tests:
          # Menangkap kalau dim_products sampai kehilangan produk.
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id

  - name: dim_products
    columns:
      - name: product_id
        tests: [not_null, unique]

  - name: fct_daily_sales
    columns:
      - name: event_date
        tests: [not_null, unique]
      - name: revenue
        tests: [not_null]

  - name: fct_daily_funnel
    columns:
      - name: event_date
        tests: [not_null, unique]
      - name: sessions
        tests: [not_null]